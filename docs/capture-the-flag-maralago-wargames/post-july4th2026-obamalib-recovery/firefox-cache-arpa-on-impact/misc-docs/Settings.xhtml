        <!--?lit$3943389965$--><!----><html:setting-group groupid="firefoxLabsFeatures" data-hidden-by-setting-group=""><!----><html:moz-card data-l10n-attrs="heading" type="default"><!--?lit$3943389965$--><html:moz-fieldset data-l10n-attrs="label,description,arialabel"><!--?lit$3943389965$--></html:moz-fieldset></html:moz-card></html:setting-group><!---->
      <html:p class="firefoxLabs-description" data-l10n-id="pane-experimental-description4">Give
 our experimental features a try! They’re in development and evolving, 
which could impact how Firefox works. We only receive data about your 
use of these features if you have <html:a is="moz-support-link" data-l10n-name="data-collection" support-page="technical-and-interaction-data" href="https://support.mozilla.org/1/firefox/152.0.5/Darwin/en-US/technical-and-interaction-data" target="_blank">technical and interaction data</html:a> turned on.</html:p><html:moz-button id="experimentalCategory-reset" data-l10n-id="pane-experimental-reset" iconsrc="chrome://global/skin/icons/arrow-counterclockwise-16.svg" data-l10n-attrs="label,tooltiptext" type="default" size="default" iconposition="start" menuid="" label="Restore Defaults"></html:moz-button><html:div id="pane-experimental-featureGates"><html:moz-card class="featureGate" data-l10n-attrs="heading" type="default"><html:moz-fieldset data-l10n-id="experimental-features-group-customize-browsing" data-l10n-attrs="label,description,arialabel" label="Customize your browsing"><html:moz-checkbox data-nimbus-slug="firefox-labs-urlbar-ime-search" data-nimbus-branch-slug="control" id="firefox-labs-urlbar-ime-search" aria-describedby="firefox-labs-urlbar-ime-search-description" data-l10n-id="experimental-features-ime-search" data-l10n-attrs="label,description,accesskey,placeholder,dialogtitle" inputlayout="inline" label="Address Bar: show results during IME composition"><html:div slot="description" id="firefox-labs-urlbar-ime-search-description" class="featureGateDescription" data-l10n-id="experimental-features-ime-search-description">An IME (Input Method Editor) is a tool that allows you to enter complex symbols, such as those used in East Asian or Indic written languages, using a standard keyboard. Enabling this experiment will keep the address bar panel open, showing search results and suggestions, while using IME to input text. Note that the IME might display a panel that covers the address bar results, therefore this preference is only suggested for IME not using this type of panel.</html:div></html:moz-checkbox></html:moz-fieldset></html:moz-card><html:moz-card class="featureGate" data-l10n-attrs="heading" type="default"><html:moz-fieldset data-l10n-id="experimental-features-group-productivity" data-l10n-attrs="label,description,arialabel" label="Productivity"><html:moz-checkbox data-nimbus-slug="tab-notes-firefox-labs-149" data-nimbus-branch-slug="control" id="tab-notes-firefox-labs-149" aria-describedby="tab-notes-firefox-labs-149-description" data-l10n-id="experimental-features-tab-notes" data-l10n-attrs="label,description,accesskey,placeholder,dialogtitle" inputlayout="inline" label="Tab notes"><html:div slot="description" id="tab-notes-firefox-labs-149-description" class="featureGateDescription" data-l10n-id="experimental-features-tab-notes-description">Tab notes are an experimental feature that lets you add sticky notes to your browser tabs. Jot down context, reminders, or next steps so you can come back and remember why you opened it. We’d love your feedback as we keep improving this feature. <html:a data-l10n-name="connect" href="https://connect.mozilla.org/t5/discussions/tab-notes-going-live-in-firefox-labs-please-share-your-feedback/td-p/118317" target="_blank">Share feedback</html:a></html:div></html:moz-checkbox></html:moz-fieldset></html:moz-card><html:moz-card class="featureGate" data-l10n-attrs="heading" type="default"><html:moz-fieldset data-l10n-id="experimental-features-group-webpage-display" data-l10n-attrs="label,description,arialabel" label="Webpage Display"><html:moz-checkbox data-nimbus-slug="firefox-labs-jpeg-xl-release" data-nimbus-branch-slug="control" id="firefox-labs-jpeg-xl-release" aria-describedby="firefox-labs-jpeg-xl-release-description" data-l10n-id="experimental-features-media-jxl" data-l10n-attrs="label,description,accesskey,placeholder,dialogtitle" inputlayout="inline" label="Media: JPEG XL"><html:div slot="description" id="firefox-labs-jpeg-xl-release-description" class="featureGateDescription" data-l10n-id="experimental-features-media-jxl-description">With this feature enabled, Firefox supports the JPEG XL (JXL) format. This is an enhanced image file format that supports lossless transition from traditional JPEG files. See <html:a data-l10n-name="bugzilla" href="https://bugzilla.mozilla.org/show_bug.cgi?id=1539075" target="_blank">bug 1539075</html:a> for more details.</html:div></html:moz-checkbox></html:moz-fieldset></html:moz-card></html:div></html:section>
