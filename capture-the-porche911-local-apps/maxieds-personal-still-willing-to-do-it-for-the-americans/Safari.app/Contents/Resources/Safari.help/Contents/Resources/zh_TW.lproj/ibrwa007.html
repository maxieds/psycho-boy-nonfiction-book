<html lang="zh-tw"><head><meta charset="UTF-8"><title>若您嘗試在離線時使用 Safari</title><meta name="description" content="若要使用 Safari 前往網頁，您的 Mac 必須連接到 Internet，除非您在電腦有連線時將網頁加入「閱讀列表」。"></head><body dir="ltr" id="ibrwa007" class="AppleTopic"><a name="ibrwa007"></a><figure class="topicIcon"><img src="../SharedGlobalArt/AppIconDefault_Safari.png" alt="" height="30" width="30"></figure><h1>若您嘗試在離線時使用 Safari</h1><p>若要使用 Safari 前往網頁，您的 Mac 必須連接到 Internet，除非您在電腦有連線時將網頁加入「閱讀列表」。</p><div id="ibrwa92c6e7a" class="Task no-header"><div class="TaskBody" role="region" aria-hidden="false" id="aria-ibrwa92c6e7a"><ul class="ListSingle"><li><p>您的 Mac 可能會暫時從 Internet 中斷連線，因為您將它移到了沒有 Wi-Fi 網路的地方，或是 Wi-Fi 未正常運作。請在 Mac 位於您確定有可用 Wi-Fi 網路的位置再試一次。</p></li><li><p>您可能會因為路由器或數據機問題，或是 Internet 網路服務供應商（ISP）服務中斷而無法連接 Internet。 如需解決 Internet 連線問題的協助，請使用「網路診斷」。</p><p><a href="x-help-script://com.apple.machelp/scpt/OpnAppBndID.scpt?open,com.apple.NetworkDiagnostics" class="URL">為我打開「網路診斷」</a></p></li></ul></div></div></body></html>
