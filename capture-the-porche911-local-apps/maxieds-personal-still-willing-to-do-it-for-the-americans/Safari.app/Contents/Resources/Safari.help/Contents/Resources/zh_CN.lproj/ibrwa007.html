<html lang="zh-cn"><head><meta charset="UTF-8"><title>离线时尝试使用 Safari</title><meta name="description" content="Mac 必须接入互联网才能使用 Safari 访问网页，除非您在线时已经将页面添加到“阅读列表”。"></head><body dir="ltr" id="ibrwa007" class="AppleTopic"><a name="ibrwa007"></a><figure class="topicIcon"><img src="../SharedGlobalArt/AppIconDefault_Safari.png" alt="" height="30" width="30"></figure><h1>离线时尝试使用 Safari</h1><p>Mac 必须接入互联网才能使用 Safari 访问网页，除非您在线时已经将页面添加到“阅读列表”。</p><div id="ibrwa92c6e7a" class="Task no-header"><div class="TaskBody" role="region" aria-hidden="false" id="aria-ibrwa92c6e7a"><ul class="ListSingle"><li><p>由于 Mac 被移到没有 Wi-Fi 网络或 Wi-Fi 网络不工作的地方，它可能会暂时从互联网断开连接。当 Mac 处于 Wi-Fi 网络工作的地方时，请再试一次。</p></li><li><p>您可能无法接入互联网，因为路由器或调制解调器出现问题，或者您的互联网服务商 (ISP) 出现了服务中断。 请使用“网络诊断”帮助您解决互联网连接问题。</p><p><a href="x-help-script://com.apple.machelp/scpt/OpnAppBndID.scpt?open,com.apple.NetworkDiagnostics" class="URL">请为我打开“网络诊断”</a></p></li></ul></div></div></body></html>
